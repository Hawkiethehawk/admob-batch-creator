<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>AdMob 实机结构脱敏夹具</title>
<style>body{font:14px sans-serif} [hidden]{display:none!important}</style></head>
<body>
<nav id="sidebar"><span class="primary-label unlinked-primary-text">测试应用</span>
  <material-list-item href="/v2/apps/2222222222/adunits/list" role="link" aria-label="“测试应用”中的广告单元" class="secondary-sidebar-item item selected">广告单元</material-list-item>
  <material-list-item href="/v2/apps/2222222222/settings" role="link" aria-label="“测试应用”的应用设置" class="secondary-sidebar-item item">应用设置</material-list-item>
</nav>
<main id="app" role="main"></main>
<script>
(() => {
  const APP = '2222222222';
  const PUB = '1111111111111111';
  const unit = (n) => 'ca-app-pub-' + PUB + '/' + String(3333333000 + n).slice(-10);
  const units = [
    { name: '既有插页', unitId: unit(1), format: 'interstitial', floor: '200.00', mode: 'manual' },
    { name: '既有开屏', unitId: unit(2), format: 'app-open', floor: '15.00', mode: 'manual' },
    { name: '目标名称', unitId: unit(3), format: 'interstitial', floor: '60.00', mode: 'manual' },
  ];
  const app = document.getElementById('app');
  const state = { page: 'list', format: 'interstitial', clicks: [], created: [], currency: 'US$', maxName: 80, extendedForms: false, partnerBidding: false };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (f) => ({ banner: '横幅广告', interstitial: '插页式广告', 'rewarded-interstitial': '插页式激励广告', rewarded: '激励广告', native: '原生高级广告', 'app-open': '开屏广告' })[f];
  const formats = ['banner', 'interstitial', 'rewarded-interstitial', 'rewarded', 'native', 'app-open'];
  const partnerFormats = formats.filter(format => format !== 'rewarded-interstitial');
  const media = {
    banner: ['文字、图片和富媒体', '视频'], interstitial: ['文字、图片和富媒体', '视频'], 'app-open': ['文字、图片和富媒体', '视频'],
    native: ['图片', '视频'], rewarded: ['视频', '广告连播', '互动式'], 'rewarded-interstitial': ['视频', '互动式'],
  };

  function pageHeader() {
    return '<div class="app-card"><span class="primary-label unlinked-primary-text">测试应用</span><span>免费</span><span>Android</span></div>';
  }
  function renderList() {
    state.page = 'list';
    app.innerHTML = '<h1>广告单元</h1>' + pageHeader() +
      '<div class="toolbar"><input aria-label="按广告单元名称、广告单元 ID 和广告格式搜索广告单元" class="search" value=""></div>' +
      '<div class="ess-table-constraint"><div class="ess-table-wrapper"><div class="ess-table-canvas" role="grid" aria-label="广告单元">' +
      '<div class="particle-table-row particle-table-header" role="row">' +
      '<div role="columnheader" class="particle-table-header-cell" aria-label="广告单元" essfield="ad-unit-with-id-info">广告单元</div>' +
      '<div role="columnheader" class="particle-table-header-cell" aria-label="广告格式" essfield="ad-unit-format">广告格式</div></div>' +
      units.map((u) => '<div class="particle-table-row" role="row">' +
        '<ess-cell role="gridcell" class="resizable" essfield="ad-unit-with-id-info"><ad-unit-with-id-cell><a class="u-primary-text u-clickable-link admob-link" role="link" href="/v2/apps/' + APP + '/adunits/' + u.unitId.split('/')[1] + '/edit">' + esc(u.name) + '</a>' +
        '<div class="ad-unit-id-container"><div class="u-secondary-text">' + u.unitId + '</div></div></ad-unit-with-id-cell></ess-cell>' +
        '<ess-cell role="gridcell" class="resizable" essfield="ad-unit-format">' + fmt(u.format) + '</ess-cell></div>').join('') +
      '</div></div><div class="table-footer">第 1 - ' + units.length + ' 行，共 ' + units.length + ' 行</div>' +
      '<material-button class="first" aria-label="转到首页" aria-disabled="true" role="button">first</material-button>' +
      '<material-button class="prev" aria-label="转到上一页" aria-disabled="true" role="button">prev</material-button>' +
      '<material-button class="next" aria-label="转到下一页" aria-disabled="true" role="button">next</material-button>' +
      '<material-button class="last" aria-label="转到末页" aria-disabled="true" role="button">last</material-button></div>' +
      '<material-button class="add-ad-unit-button" aria-label="添加广告单元" role="button">添加广告单元</material-button>';
    app.querySelector('.add-ad-unit-button').onclick = renderFormats;
    for (const a of app.querySelectorAll('a[href*="/adunits/"]')) {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const id = a.getAttribute('href').split('/').slice(-2)[0];
        const u = units.find((x) => x.unitId.endsWith('/' + id));
        history.pushState({}, '', a.getAttribute('href'));
        renderDetail(u);
      });
    }
  }
  function renderFormats() {
    state.page = 'formats';
    app.innerHTML = '<h1>选择广告格式</h1>' + pageHeader() + '<div class="formats">' +
      formats.map(f => [f, fmt(f)]).map(([f, label]) =>
        '<section class="ad-format-card"><div class="header"><span>' + label + '</span></div>' +
        '<material-button class="select-button" role="button" data-format="' + f + '" aria-label="' + label + '">选择</material-button></section>').join('') + '</div>';
    for (const b of app.querySelectorAll('.select-button')) {
      b.onclick = () => {
        state.format = b.getAttribute('data-format');
        renderForm(state.format);
      };
    }
  }
  function renderForm(format) {
    state.page = 'form';
    state.format = format;
    state.partnerBidding = false;
    const partner = state.extendedForms && partnerFormats.includes(format) ?
      '<third-party-bidding-card><material-checkbox role="checkbox" aria-checked="false"><material-icon>check_box_outline_blank</material-icon>' +
      '<div class="bidding-headline">我目前在另一中介平台<strong>（而非 AdMob）</strong>上将此广告单元用于实时出价。</div>' +
      '<div>创建广告单元后，您将无法更改此设置</div></material-checkbox></third-party-bidding-card>' : '';
    app.innerHTML = '<h1>创建广告单元</h1>' + pageHeader() +
      '<material-input><label class="input-container"><div class="label"><span class="label-text" id="name-label">输入广告单元名称</span></div>' +
      '<input class="input input-area" type="text" aria-labelledby="name-label" aria-invalid="false"></label></material-input>' +
      '<div class="counter-container"><div class="counter">0/' + state.maxName + '</div></div>' +
      '<div class="format-row"><span>广告格式</span><div class="format-label">' + fmt(format) + '</div></div>' +
      partner + '<div class="platform-defaults"></div><div class="floor-settings"></div>' +
      '<material-button class="btn btn-yes is-disabled" aria-disabled="true" role="button">创建广告单元</material-button>';
    const floorMarkup = '<a class="advanced-settings-toggle" role="button" aria-expanded="false"><span class="title">高级设置</span></a>' +
      '<div class="advanced" hidden>' +
      '<material-radio role="radio" aria-checked="true" tabindex="0">由 Google 优化</material-radio>' +
      '<material-radio role="radio" aria-checked="false" tabindex="0">人工指定底价</material-radio>' +
      '<material-radio role="radio" aria-checked="false" tabindex="0">已停用</material-radio>' +
      '<manual-ecpm-floor-input hidden><div class="u-secondary-text global-ecpm-input-label" id="floor-label">输入全球有效每千次展示费用底价</div>' +
      '<material-input type="money64"><span class="leading-text">' + esc(state.currency) + '</span><label class="input-container"><input type="text" inputmode="numeric" aria-labelledby="floor-label" aria-invalid="false"></label></material-input></manual-ecpm-floor-input>' +
      '</div>';
    const name = app.querySelector('input[type="text"]');
    const counter = app.querySelector('.counter');
    const create = app.querySelector('.btn-yes');
    const refresh = () => {
      counter.textContent = name.value.length + '/' + state.maxName;
      const values = readForm();
      const floor = app.querySelector('manual-ecpm-floor-input input');
      create.setAttribute('aria-disabled', String(!(name.value.trim() && values.mode && (values.mode !== 'manual' || (floor && floor.value && floor.getAttribute('aria-invalid') !== 'true')))));
      create.classList.toggle('is-disabled', create.getAttribute('aria-disabled') === 'true');
    };
    const mountFloor = () => {
      const host = app.querySelector('.floor-settings'); host.innerHTML = state.partnerBidding ? '' : floorMarkup;
      if (state.partnerBidding) return;
      const advanced = host.querySelector('.advanced-settings-toggle'), advancedBody = host.querySelector('.advanced');
      const floorWrap = host.querySelector('manual-ecpm-floor-input');
      const radios = [...host.querySelectorAll('[role="radio"]')];
      const manual = radios.find(radio => radio.textContent.includes('人工指定底价'));
      floorWrap.querySelector('input').addEventListener('input', refresh);
      advanced.addEventListener('click', () => { advanced.setAttribute('aria-expanded', 'true'); advancedBody.hidden = false; });
      for (const radio of radios) radio.addEventListener('click', () => {
        for (const option of host.querySelectorAll('[role="radio"]')) option.setAttribute('aria-checked', String(option === radio));
        floorWrap.hidden = radio !== manual; refresh();
      });
    };
    const mountDefaults = () => {
      if (!state.extendedForms) return;
      app.querySelector('.platform-defaults').innerHTML = '<ad-media-type-card>' + media[format].map((label, index) =>
        '<material-checkbox role="checkbox" aria-checked="true" aria-labelledby="media-' + index + '"><material-icon>check_box</material-icon><div class="content"><div id="media-' + index + '" role="button" aria-label="Point for more information">' + label + '</div></div></material-checkbox>').join('') + '</ad-media-type-card>' +
        (format === 'banner' || format === 'native' ? '' : '<frequency-cap-card><div role="switch" aria-checked="false" aria-label="已停用">已停用<material-icon>remove</material-icon></div></frequency-cap-card>') +
        (!state.partnerBidding && (format === 'rewarded' || format === 'rewarded-interstitial') ?
          '<reward-settings-card><reward-settings-input><material-input class="reward-amount" type="number"><label id="reward-amount-label">输入奖品数量</label><input aria-labelledby="reward-amount-label" value="1" aria-invalid="false" required></material-input>' +
          '<material-input class="reward-type"><textarea aria-label="输入奖品" aria-invalid="false">Reward</textarea></material-input></reward-settings-input></reward-settings-card><server-side-verification-card>未设置</server-side-verification-card>' : '');
    };
    mountFloor(); mountDefaults();
    name.addEventListener('input', refresh);
    const bidding = app.querySelector('third-party-bidding-card [role="checkbox"]');
    if (bidding) bidding.addEventListener('click', () => {
      state.partnerBidding = bidding.getAttribute('aria-checked') !== 'true';
      bidding.setAttribute('aria-checked', String(state.partnerBidding)); mountFloor(); mountDefaults();
      refresh();
    });
    create.addEventListener('click', () => {
      if (create.getAttribute('aria-disabled') === 'true') return;
      const values = readForm();
      state.clicks.push({ name: values.name, floor: values.floor, format: values.format });
      const u = { name: values.name, unitId: unit(9 + state.created.length), format: values.format, floor: values.floor, mode: values.mode,
        ...(state.extendedForms || values.partnerBidding ? { partnerBidding: values.partnerBidding } : {}) };
      units.push(u); state.created.push(u);
      history.pushState({}, '', '/v2/apps/' + APP + '/adunits/' + u.unitId.split('/')[1] + '/edit');
      renderDetail(u);
    });
    refresh();
  }
  function readForm() {
    const name = app.querySelector('material-input:not([type]) input')?.value || '';
    const bidding = app.querySelector('third-party-bidding-card [role="checkbox"]');
    const partnerBidding = bidding?.getAttribute('aria-checked') === 'true';
    const selected = [...app.querySelectorAll('[role="radio"], input[type="radio"]')].filter(radio => radio.getAttribute('aria-checked') === 'true' || radio.checked === true);
    const selectedText = selected.length === 1 ? selected[0].textContent || selected[0].labels?.[0]?.textContent || '' : '';
    const mode = partnerBidding ? 'partner-bidding' : !selectedText ? undefined : selectedText.includes('人工指定底价') ? 'manual' : selectedText.includes('已停用') ? 'disabled' : 'auto';
    return { name, format: state.format, mode, floor: mode === 'manual' ? app.querySelector('manual-ecpm-floor-input input')?.value || '' : '', partnerBidding };
  }
  function renderDetail(u) {
    state.page = 'detail';
    const partnerBidding = u.partnerBidding === true || u.mode === 'partner-bidding';
    app.innerHTML = '<h1>修改广告单元</h1>' + pageHeader() +
      '<div class="header" aria-label="广告单元名称" aria-describedby="v-name"><div class="panel-name"><span class="collapsed-title">广告单元名称</span></div><div class="panel-description" id="v-name">' + esc(u.name) + '</div></div>' +
      '<div class="header" aria-label="广告格式" aria-describedby="v-format"><div class="panel-name">广告格式</div><div class="panel-description" id="v-format">' + fmt(u.format) + '</div></div>' +
      '<div class="header" aria-label="广告单元 ID" aria-describedby="v-id"><div class="panel-name">广告单元 ID</div><div class="panel-description" id="v-id">' + u.unitId + '</div></div>' +
      (partnerBidding ? '' : '<div class="header" aria-label="有效每千次展示费用底价" aria-describedby="v-floor"><div class="panel-name">有效每千次展示费用底价</div><div class="panel-description" id="v-floor">' + (u.mode === 'auto' ? '由 Google 优化' : u.mode === 'disabled' ? '已停用' : '全球底价设为 $' + esc(u.floor)) + '</div></div>') +
      (state.extendedForms || u.partnerBidding !== undefined || partnerBidding ? '<div class="header" aria-label="合作平台出价" aria-describedby="v-partner"><div class="panel-name">合作平台出价</div><div class="panel-description" id="v-partner">' + (partnerBidding ? '已启用' : '已停用') + '</div></div>' : '') +
      '<material-list-item href="/v2/apps/' + APP + '/adunits/list" role="link" aria-label="“测试应用”中的广告单元" class="secondary-sidebar-item item">广告单元</material-list-item>';
    const link = app.querySelector('material-list-item[href$="/adunits/list"]');
    link.addEventListener('click', (e) => { e.preventDefault(); history.pushState({}, '', '/v2/apps/' + APP + '/adunits/list'); renderList(); });
  }
  addEventListener('popstate', () => {
    if (location.pathname.endsWith('/adunits/list')) renderList();
    else {
      const match = location.pathname.match(/\/adunits\/(\d{10})\/edit\/?$/);
      const saved = match && units.find(u => u.unitId.endsWith('/' + match[1]));
      if (saved) renderDetail(saved);
    }
  });
  const sidebarList = document.querySelector('#sidebar material-list-item[href$="/adunits/list"]');
  sidebarList.addEventListener('click', (e) => { e.preventDefault(); history.pushState({}, '', '/v2/apps/' + APP + '/adunits/list'); renderList(); });
  renderList();
  window.fixture = { state, units, formats, partnerFormats, media, renderList, renderFormats, renderForm, renderDetail, readForm,
    setExtendedForms(enabled = true) { state.extendedForms = enabled; } };
})();
</script>
</body></html>
